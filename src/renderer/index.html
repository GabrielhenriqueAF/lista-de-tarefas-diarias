<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotina Gabriel</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <section class="brand">
        <p class="eyebrow">ROTINA PESSOAL</p>
        <h1>Rotina Gabriel</h1>
      </section>
      <section class="topbar-actions">
        <nav aria-label="Áreas do aplicativo">
          <button data-tab="week" type="button">Minha semana</button>
          <button data-tab="today" type="button">Hoje</button>
          <button data-tab="progress" type="button">Progresso</button>
          <button data-tab="history" type="button">Histórico</button>
          <button data-tab="settings" type="button">Configurações</button>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema"></button>
      </section>
    </header>
    <p id="app-status" class="app-status" role="status" aria-live="polite"></p>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="app.js"></script>
  </body>
</html>
