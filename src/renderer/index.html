<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotina Gabriel</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="titlebar">
      <div class="app-mark" aria-label="Rotina Gabriel"><i></i><span>Rotina Gabriel</span></div>
      <nav class="tabs" aria-label="Áreas do aplicativo">
        <button data-tab="today" type="button">Hoje</button>
        <button data-tab="week" type="button">Semana</button>
        <button data-tab="history" type="button">Frentes</button>
        <button data-tab="progress" type="button">Progresso</button>
        <button data-tab="settings" type="button">Ajustes</button>
      </nav>
      <section class="titlebar-end">
        <span id="sync-indicator" class="sync-indicator" title="Estado da sincronização"><i></i>Não sincronizado</span>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Alternar tema"></button>
      </section>
    </header>
    <main id="app" aria-live="polite"></main>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
