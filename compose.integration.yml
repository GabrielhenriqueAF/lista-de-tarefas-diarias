services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Use o script de integração}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use o script de integração}
      POSTGRES_DB: ${POSTGRES_DB:?Use o script de integração}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - integration-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

volumes:
  integration-data:
